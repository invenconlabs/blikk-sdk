name: Go Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      self: ${{ steps.filter.outputs.self }}
      trusted: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '**/testdata/**'
            self:
              - '.github/workflows/test.yml'

  unit-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
    needs: changes
    if: github.event_name == 'release' || needs.changes.outputs.go == 'true' || needs.changes.outputs.self == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'

      - name: Run Go Tidy
        run: go mod tidy -diff

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -race -v -json ./... > unit-test-results.json

      - name: Report Unit Tests
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always() && needs.changes.outputs.trusted == 'true'
        with:
          name: Unit Test Results
          path: unit-test-results.json
          reporter: golang-json

  integration-test:
    # Needs repository secrets, so never on pull requests from forks.
    if: needs.changes.outputs.trusted == 'true' && (github.event_name == 'release' || github.event_name == 'pull_request' || needs.changes.outputs.self == 'true')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
    needs: [unit-test, changes] # Ensures unit tests pass before running integration tests on release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
      
      - name: Run Go Tidy
        run: go mod tidy -diff

      - name: Run Go Vet
        run: go vet -tags=integration ./...

      - name: Run Integration Tests
        env:
          BLIKK_APP_ID: ${{ secrets.BLIKK_APP_ID }}
          BLIKK_APP_SECRET: ${{ secrets.BLIKK_APP_SECRET }}
        run: go test -v -tags=integration -json ./... > integration-test-results.json

      - name: Report Integration Tests
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Integration Test Results
          path: integration-test-results.json
          reporter: golang-json