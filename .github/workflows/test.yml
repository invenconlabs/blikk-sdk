name: Go Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      self: ${{ steps.filter.outputs.self }}
      trusted: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
            self:
              - '.github/workflows/test.yml'

  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    needs: changes
    if: github.event_name == 'release' || needs.changes.outputs.go == 'true' || needs.changes.outputs.self == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go Tidy
        run: go mod tidy

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -json ./... > unit-test-results.json

      - name: Report Unit Tests
        uses: dorny/test-reporter@v2
        if: always() && needs.changes.outputs.trusted == 'true'
        with:
          name: Unit Test Results
          path: unit-test-results.json
          reporter: golang-json

  integration-test:
    # Needs repository secrets, so never on pull requests from forks.
    if: needs.changes.outputs.trusted == 'true' && (github.event_name == 'release' || github.event_name == 'pull_request' || needs.changes.outputs.self == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    needs: [unit-test, changes] # Ensures unit tests pass before running integration tests on release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Run Go Tidy
        run: go mod tidy

      - name: Run Go Vet
        run: go vet -tags=integration ./...

      - name: Run Integration Tests
        env:
          BLIKK_APP_ID: ${{ secrets.BLIKK_APP_ID }}
          BLIKK_APP_SECRET: ${{ secrets.BLIKK_APP_SECRET }}
        run: go test -v -tags=integration -json ./... > integration-test-results.json

      - name: Report Integration Tests
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Integration Test Results
          path: integration-test-results.json
          reporter: golang-json