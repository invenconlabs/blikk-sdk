name: Go Test Suite

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/testdata/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/testdata/**'
      - '.github/workflows/test.yml'
  release:
    types: [created]

jobs:
  unit-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Go Tidy
        run: go mod tidy -diff

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: gotestsum --format github-actions --junitfile unit.xml -- -race ./...

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-results
          path: unit.xml

  integration-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Go Tidy
        run: go mod tidy -diff

      - name: Run Go Vet
        run: go vet -tags=integration ./...

      - name: Run Integration Tests
        env:
          BLIKK_APP_ID: ${{ secrets.BLIKK_APP_ID }}
          BLIKK_APP_SECRET: ${{ secrets.BLIKK_APP_SECRET }}
        run: gotestsum --format github-actions --junitfile integration.xml -- -tags=integration -run '^TestIntegration' ./...

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-results
          path: integration.xml

  report:
    # Fork pull requests get no secrets and a read-only token, so they only run unit tests and post nothing.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [unit-test, integration-test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: read
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-results'
          path: results
          merge-multiple: true

      - name: Report Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          check_name: Test Results
          files: results/*.xml
          comment_mode: always
